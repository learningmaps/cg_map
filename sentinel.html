    <style>
        :root {
            --primary: #7a5530;
            --bg-creme: #FEFBE3;
            --border: #CFD8B3;
            --accent: #CD9C69;
        }

        #search-box {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 90%;
            max-width: 500px;
            display: flex;
            gap: 10px;
        }

        #search-box input {
            flex: 1;
            padding: 10px 20px;
            border-radius: 25px;
            border: 1px solid var(--border);
            background: var(--bg-creme);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }

        #map-date-badge {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(254, 251, 227, 0.95);
            border: 1px solid var(--border);
            color: var(--primary);
            padding: 8px 16px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 800;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            pointer-events: none;
            display: none;
            letter-spacing: 0.5px;
        }

        .sentinel-fade-overlay {
            transition: opacity var(--fade-duration, 0.4s) ease-in-out !important;
            will-change: opacity;
        }

        #time-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(254, 251, 227, 0.92);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 8px 24px;
            width: auto;
            min-width: 640px;
            max-width: 95%;
            box-shadow: 0 8px 32px rgba(130, 100, 60, 0.15);
            color: var(--primary);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .compact-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .date-display {
            font-weight: 800;
            font-size: 13px;
            white-space: nowrap;
        }

        .play-btn {
            width: 32px;
            height: 32px;
            font-size: 14px;
            flex-shrink: 0;
            cursor: pointer;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--primary);
            color: white;
        }

        input[type="range"] {
            flex-grow: 1;
            height: 4px;
        }

        .settings-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 10px;
            border-top: 1px solid rgba(207, 216, 179, 0.3);
            padding-top: 4px;
        }

        .settings-row input, .settings-row select {
            background: transparent;
            border: none;
            font-size: 10px;
            color: var(--primary);
            font-weight: 600;
            padding: 2px;
            cursor: pointer;
        }

        .divider {
            width: 1px;
            height: 12px;
            background: var(--border);
        }

        /* Responsive */
        @media (max-width: 768px) {
            #time-panel { 
                min-width: 90%; 
                border-radius: 20px;
                padding: 10px;
                bottom: 65px;
            }
            .settings-row { flex-wrap: wrap; justify-content: center; }
            #map-date-badge {
                bottom: 120px;
                right: 10px;
                padding: 6px 12px;
                font-size: 11px;
            }
        }
    </style>

    <script type="module">
        import Lightbox from 'https://unpkg.com/@duccanhole/lightbox@0.0.5/index.js';
        window.__lb = new Lightbox();
        const lbJs = document.getElementById('lightbox-js');
        if (lbJs) lbJs.style.zIndex = '10000';

        function initGallery() {
            if (!window.PHOTO_LIST) return;
            window.__lb.setGallery(window.PHOTO_LIST.map(img => ({
                type: 'image',
                src: img.url,
                thumbnail: img.url,
                downloadUrl: img.url,
            })));
            window.openPhotoOverlay = (id) => {
                const idx = window.PHOTO_LIST.findIndex(p => p.id === id);
                if (idx >= 0) window.__lb.openGalleryItem(idx);
            };
        }

        if (window.PHOTO_LIST && window.PHOTO_LIST.length > 0) {
            initGallery();
        } else {
            window.addEventListener('photos-loaded', initGallery);
        }
    </script>

        function handleWorkflowChange() {
            const mode = document.getElementById('workflow-mode').value;
            const monthSelect = document.getElementById('month-filter');
            const startYearSelect = document.getElementById('start-year');
            const endYearSelect = document.getElementById('end-year');
            const labelYears = document.getElementById('label-years');
            const labelTo = document.getElementById('label-to');

                endYearSelect.style.display = 'inline-block';

        function handleExposureChange(val) {
            const exp = parseFloat(val);
            const percent = Math.round(exp * 100);
            const valEl = document.getElementById('exposure-val');
            if (valEl) valEl.textContent = `${percent}%`;
            const pane = map.getPane('sentinelPane');
            if (pane) {
                const brightness = exp;
                const contrast = 0.5 + 0.5 * exp;
                pane.style.filter = `brightness(${brightness}) contrast(${contrast})`;
            }
        }

        function resetTimeline() {
            if (isPlaying) {
                isPlaying = false;
                const btn = document.getElementById('play-btn');
                if (btn) btn.textContent = '▶';
                if (playInterval) clearInterval(playInterval);
            }
            clearCache();
            const slider = document.getElementById('time-slider');
            if (slider) {
                slider.value = 0;
                slider.max = 0;
                slider.disabled = true;
            }
            const currentDateEl = document.getElementById('current-date');
            if (currentDateEl) {
                currentDateEl.textContent = 'Loading...';
            }
            const startLabel = document.getElementById('start-label');
            const endLabel = document.getElementById('end-label');
            if (startLabel) startLabel.textContent = '--';
            if (endLabel) endLabel.textContent = '--';
            const downloadBtn = document.getElementById('download-all-btn');
            if (downloadBtn) downloadBtn.style.display = 'none';
            fetchImages();
        }

        handleExposureChange(0.9);

        function evictCache() {
            let total = 0;
            for (const entry of imageCache.values()) total += entry.size;
            
            const layerType = document.getElementById('img-type').value;
            const activeTimelineKeys = new Set(items.map(item => `${item.id}_${layerType}`));
            
            let attempts = 0;
            const maxAttempts = cacheOrder.length;
            
            while (total > MAX_CACHE_SIZE && cacheOrder.length > 1 && attempts < maxAttempts) {
                attempts++;
                const key = cacheOrder.shift();
                if (activeTimelineKeys.has(key)) { 
                    cacheOrder.push(key); 
                    continue; 
                }
                const entry = imageCache.get(key);
                if (entry) {
                    if (entry.overlay) {
                        map.removeLayer(entry.overlay);
                    }
                    URL.revokeObjectURL(entry.objectUrl);
                    imageCache.delete(key);
                    total -= entry.size;
                }
            }
        }

        function clearCache() {
            for (const entry of imageCache.values()) {
                if (entry.overlay) {
                    map.removeLayer(entry.overlay);
                }
                URL.revokeObjectURL(entry.objectUrl);
            }
            imageCache.clear();
            cacheOrder = [];
            const badgeEl = document.getElementById('map-date-badge');
            if (badgeEl) {
                badgeEl.style.display = 'none';
                badgeEl.textContent = '';
            }
        }

        function clearTimelineOverlays() {
            // Remove DOM layers from the map, but keep blobs in memory cache
            for (const entry of imageCache.values()) {
                if (entry.overlay) {
                    map.removeLayer(entry.overlay);
                }
            }
        }

        function displayImage(index) {
            const activeItem = items[index];
            if (!activeItem) return;
            const layerType = document.getElementById('img-type').value;
            const activeKey = `${activeItem.id}_${layerType}`;

            const activeEntry = imageCache.get(activeKey);
            if (activeEntry && activeEntry.overlay) {
                // 1. Bring active overlay to the absolute front
                activeZIndex++;
                activeEntry.overlay.setZIndex(activeZIndex);

                // 2. Make sure it's on the map
                if (!map.hasLayer(activeEntry.overlay)) {
                    activeEntry.overlay.addTo(map);
                }

                // 3. Fade it in on top of any background overlays
                activeEntry.overlay.setOpacity(1);

                // 4. Update UI date text
                const dateEl = document.getElementById('current-date');
                if (dateEl && activeEntry.dateText) {
                    dateEl.textContent = activeEntry.dateText;
                }

                const badgeEl = document.getElementById('map-date-badge');
                if (badgeEl && activeEntry.dateText) {
                    badgeEl.textContent = activeEntry.dateText;
                    badgeEl.style.display = 'block';
                }
            }

            // 5. Hide other layers after the fade transition finishes
            if (transitionTimeout) clearTimeout(transitionTimeout);
            
            const fadeDurationStr = document.documentElement.style.getPropertyValue('--fade-duration') || '0.4s';
            const fadeDurationMs = parseFloat(fadeDurationStr) * 1000 || 400;

            transitionTimeout = setTimeout(() => {
                const currentItem = items[currentIndex];
                const currentActiveKey = currentItem ? `${currentItem.id}_${layerType}` : null;

                items.forEach(item => {
                    const key = `${item.id}_${layerType}`;
                    if (key !== currentActiveKey) {
                        const entry = imageCache.get(key);
                        if (entry && entry.overlay) {
                            entry.overlay.setOpacity(0);
                        }
                    }
                });
            }, fadeDurationMs + 50);
        }

        async function fetchImages() {
            clearTimelineOverlays();
            const downloadBtn = document.getElementById('download-all-btn');
            if (downloadBtn) downloadBtn.style.display = 'none';
            const badgeEl = document.getElementById('map-date-badge');
            if (badgeEl) {
                badgeEl.style.display = 'none';
                badgeEl.textContent = '';
            }
            const bounds = map.getBounds();
            const bbox = [bounds.getWest(), bounds.getSouth(), bounds.getEast(), bounds.getNorth()];
            const provider = document.getElementById('provider').value;
            const mode = document.getElementById('workflow-mode').value;

            // Compute date ranges based on selected years
            let startStr, endStr;
            if (mode !== 'latest-clean') {
                const startYear = document.getElementById('start-year').value;
                const endYear = document.getElementById('end-year').value;
                startStr = `${startYear}-01-01T00:00:00Z`;
                endStr = `${endYear}-12-31T23:59:59Z`;
            } else {
                // Get latest 6 months for latest clean view
                const now = new Date();
                endStr = now.toISOString();
                const past = new Date(Date.now() - 180 * 24 * 60 * 60 * 1000);
                startStr = past.toISOString();
            }

            document.getElementById('loading-overlay').style.display = 'block';

            try {
                let rawItems = [];
                let currentStartStr = startStr;
                let hasMore = true;
                let pageCount = 0;
                const maxPages = 6;

                const apiEndpoint = provider === 'copernicus' ? COPERNICUS_STAC_API : MPC_STAC_API;

                while (hasMore && pageCount < maxPages) {
                    pageCount++;
                    let pageItems = [];

                    try {
                        const payload = {
                            collections: ['sentinel-2-l2a'],
                            bbox: bbox,
                            datetime: `${currentStartStr}/${endStr}`,
                            query: { 'eo:cloud_cover': { 'lt': mode === 'latest-clean' ? 15 : 80 } },
                            limit: mode === 'latest-clean' ? 50 : 1000,
                            sortby: [{ field: 'properties.datetime', direction: mode === 'latest-clean' ? 'desc' : 'asc' }]
                        };

                        const response = await fetch(apiEndpoint, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });

                        if (!response.ok) throw new Error(`STAC search returned status ${response.status}`);
                        const data = await response.json();
                        pageItems = data.features || [];
                    } catch (err) {
                        console.warn(`STAC page query failed on endpoint ${apiEndpoint}`, err);
                        
                        if (provider === 'copernicus') {
                            try {
                                const response = await fetch(MPC_STAC_API, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({
                                        collections: ['sentinel-2-l2a'],
                                        bbox: bbox,
                                        datetime: `${currentStartStr}/${endStr}`,
                                        query: { 'eo:cloud_cover': { 'lt': mode === 'latest-clean' ? 15 : 80 } },
                                        limit: mode === 'latest-clean' ? 50 : 1000,
                                        sortby: [{ field: 'properties.datetime', direction: mode === 'latest-clean' ? 'desc' : 'asc' }]
                                    })
                                });
                                if (response.ok) {
                                    const data = await response.json();
                                    pageItems = data.features || [];
                                }
                            } catch (fallbackErr) {
                                console.error("MPC Fallback STAC page query failed", fallbackErr);
                            }
                        }
                    }

                    if (pageItems.length === 0) {
                        hasMore = false;
                    } else {
                        rawItems = rawItems.concat(pageItems);

                        const currentLimit = mode === 'latest-clean' ? 50 : 1000;
                        if (pageItems.length < currentLimit || mode === 'latest-clean') {
                            hasMore = false;
                        } else {
                            const lastItem = pageItems[pageItems.length - 1];
                            const lastDate = new Date(lastItem.properties.datetime);
                            const nextDate = new Date(lastDate.getTime() + 1000);
                            currentStartStr = nextDate.toISOString();
                            
                            if (nextDate.getTime() >= new Date(endStr).getTime()) {
                                hasMore = false;
                            }
                        }
                    }
                }

                // Apply dynamic filters and groupings based on selected mode
                if (mode === 'latest-clean') {
                    // Filter to keep the single cleanest/most recent item
                    const cleanItems = rawItems.filter(item => (item.properties['eo:cloud_cover'] ?? 100) < 15);
                    const sourceItems = cleanItems.length > 0 ? cleanItems : rawItems;
                    items = sourceItems.slice(0, 1);
                } else if (mode === 'yoy-month') {
                    const targetMonth = parseInt(document.getElementById('month-filter').value);
                    const groups = new Map();
                    rawItems.forEach(item => {
                        const date = new Date(item.properties.datetime);
                        if (date.getMonth() === targetMonth) {
                            const year = date.getFullYear();
                            if (!groups.has(year)) {
                                groups.set(year, item);
                            } else {
                                const existing = groups.get(year);
                                const existingCloud = existing.properties['eo:cloud_cover'] ?? 100;
                                const currentCloud = item.properties['eo:cloud_cover'] ?? 100;
                                if (currentCloud < existingCloud) groups.set(year, item);
                            }
                        }
                    });
                    // Sort items chronologically by year
                    items = Array.from(groups.values()).sort((a, b) => new Date(a.properties.datetime) - new Date(b.properties.datetime));
                } else if (mode === 'monthly-sequence') {
                    const groups = new Map();
                    rawItems.forEach(item => {
                        const date = new Date(item.properties.datetime);
                        const key = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
                        if (!groups.has(key)) {
                            groups.set(key, item);
                        } else {
                            const existing = groups.get(key);
                            const existingCloud = existing.properties['eo:cloud_cover'] ?? 100;
                            const currentCloud = item.properties['eo:cloud_cover'] ?? 100;
                            if (currentCloud < existingCloud) groups.set(key, item);
                        }
                    });
                    // Sort items chronologically by Year-Month
                    items = Array.from(groups.values()).sort((a, b) => new Date(a.properties.datetime) - new Date(b.properties.datetime));
                }

                const slider = document.getElementById('time-slider');
                if (items.length > 0) {
                    slider.disabled = items.length === 1;
                    slider.max = items.length - 1;
                    currentIndex = items.length - 1;
                    slider.value = currentIndex;
                    updateUI();
                } else {
                    slider.disabled = true;
                    slider.max = 0;
                    slider.value = 0;
                    document.getElementById('current-date').textContent = "No images found";
                }
            } catch (e) {
                console.error("Fetch failed", e);
            } finally {
                document.getElementById('loading-overlay').style.display = 'none';
            }
        }

        function updateUI() {
            const slider = document.getElementById('time-slider');
            if (!items || items.length === 0) return;
            slider.max = items.length - 1;
            slider.value = currentIndex;
            const current = items[currentIndex];
            if (!current) return;
            const date = new Date(current.properties.datetime);
            const dateEl = document.getElementById('current-date');
            if (dateEl) {
                dateEl.textContent = date.toLocaleDateString('en-GB', {
                    day: 'numeric', month: 'long', year: 'numeric'
                });
            }
            const startEl = document.getElementById('start-label');
            const endEl = document.getElementById('end-label');
            if (startEl && items[0]) startEl.textContent = new Date(items[0].properties.datetime).getFullYear();
            if (endEl && items[items.length - 1]) endEl.textContent = new Date(items[items.length - 1].properties.datetime).getFullYear();
        }

        function handleSliderChange(val) {
            document.documentElement.style.setProperty('--fade-duration', '0.05s');
            currentIndex = parseInt(val);
            updateUI();
            displayImage(currentIndex);
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            const btn = document.getElementById('play-btn');
            if (isPlaying) {
                document.documentElement.style.setProperty('--fade-duration', '0.6s');
                btn.textContent = '⏸';
                playInterval = setInterval(() => {
                    currentIndex = (currentIndex + 1) % items.length;
                    updateUI();
                    displayImage(currentIndex);
                }, 2000);
            } else {
                btn.textContent = '▶';
                clearInterval(playInterval);
            }
        }

        async function handleSearch() {
            const query = document.getElementById('location-input').value;
            if (!query) return;
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
            const data = await res.json();
            if (data.length > 0) {
                map.setView([data[0].lat, data[0].lon], 12);
                setTimeout(fetchImages, 500);
            }
        }

        async function loadAllImages() {
            if (items.length === 0) return;

            const btn = document.getElementById('preload-btn');
            const progressContainer = document.getElementById('preload-progress-container');
            const progressBar = document.getElementById('preload-progress-bar');

            btn.disabled = true;
            btn.textContent = 'LOADING...';
            progressContainer.style.display = 'block';
            progressBar.style.width = '0%';

            loadingCancelled = false;

            const bounds = map.getBounds();
            const sw = map.options.crs.project(bounds.getSouthWest());
            const ne = map.options.crs.project(bounds.getNorthEast());
            const bbox = `${sw.x},${sw.y},${ne.x},${ne.y}`;
            const size = map.getSize();
            const width = Math.round(size.x);
            const height = Math.round(size.y);
            const layerType = document.getElementById('img-type').value;
            const isTrueColor = layerType === 'TRUE-COLOR' || layerType === 'TRUE-COLOR-HIGHLIGHT-OPTIMIZED';
            const layersParam = isTrueColor ? 'TRUE-COLOR' : layerType;

            for (let i = 0; i < items.length; i++) {
                if (loadingCancelled) break;
                const item = items[i];
                const dateStr = item.properties.datetime ? item.properties.datetime.split('T')[0] : '';
                if (!dateStr) continue;

                const cacheKey = `${item.id}_${layerType}`;
                if (imageCache.has(cacheKey)) {
                    const entry = imageCache.get(cacheKey);
                    if (!entry.overlay || !map.hasLayer(entry.overlay)) {
                        entry.overlay = L.imageOverlay(entry.objectUrl, entry.bounds, {
                            pane: 'sentinelPane',
                            opacity: 0,
                            className: 'sentinel-fade-overlay'
                        }).addTo(map);
                    }
                    // Update cache order
                    const idx = cacheOrder.indexOf(cacheKey);
                    if (idx > -1) cacheOrder.splice(idx, 1);
                    cacheOrder.push(cacheKey);
                    
                    progressBar.style.width = `${((i + 1) / items.length) * 100}%`;
                    continue;
                }

                try {
                    let url;
                    let response;
                    let activeProvider = document.getElementById('provider').value;

                    if (activeProvider === 'copernicus') {
                        try {
                            url = `${COPERNICUS_WMS_URL}?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetMap&FORMAT=image/png&TRANSPARENT=TRUE&CRS=EPSG:3857&BBOX=${bbox}&WIDTH=${width}&HEIGHT=${height}&LAYERS=${layersParam}&TIME=${dateStr}&MAXCC=${MAXCC}`;
                            if (isTrueColor) url += `&EVALSCRIPT=${encodeURIComponent(TRUECOLOR_EVALSCRIPT)}`;
                            
                            response = await fetch(url);
                            if (!response.ok) throw new Error(`Copernicus WMS returned status ${response.status}`);
                        } catch (err) {
                            console.warn(`Copernicus load failed for image ${i}, falling back to Microsoft Planetary Computer...`, err);
                            activeProvider = 'mpc';
                        }
                    }

                    if (activeProvider === 'mpc') {
                        const mpcItemId = item.id.replace(/_N[0-9]{4}_/, '_');
                        const bbox4326 = `${bounds.getWest()},${bounds.getSouth()},${bounds.getEast()},${bounds.getNorth()}`;
                        
                        if (layerType === 'TRUE-COLOR' || layerType === 'TRUE-COLOR-HIGHLIGHT-OPTIMIZED') {
                            url = `https://planetarycomputer.microsoft.com/api/data/v1/item/bbox/${bbox4326}.png?collection=sentinel-2-l2a&item=${mpcItemId}&assets=visual&width=${width}&height=${height}`;
                        } else if (layerType === 'NDVI') {
                            url = `https://planetarycomputer.microsoft.com/api/data/v1/item/bbox/${bbox4326}.png?collection=sentinel-2-l2a&item=${mpcItemId}&assets=B08&assets=B04&expression=(B08-B04)/(B08%2BB04)&colormap_name=rdylgn&asset_as_band=true&rescale=-1,1&width=${width}&height=${height}`;
                        } else if (layerType === 'NDMI') {
                            url = `https://planetarycomputer.microsoft.com/api/data/v1/item/bbox/${bbox4326}.png?collection=sentinel-2-l2a&item=${mpcItemId}&assets=B08&assets=B11&expression=(B08-B11)/(B08%2BB11)&colormap_name=rdylbu&asset_as_band=true&rescale=-1,1&width=${width}&height=${height}`;
                        } else if (layerType === 'NDWI') {
                            url = `https://planetarycomputer.microsoft.com/api/data/v1/item/bbox/${bbox4326}.png?collection=sentinel-2-l2a&item=${mpcItemId}&assets=B03&assets=B08&expression=(B03-B08)/(B03%2BB08)&colormap_name=greens&asset_as_band=true&rescale=-1,1&width=${width}&height=${height}`;
                        } else if (layerType === 'FALSE-COLOR') {
                            url = `https://planetarycomputer.microsoft.com/api/data/v1/item/bbox/${bbox4326}.png?collection=sentinel-2-l2a&item=${mpcItemId}&assets=B08&assets=B04&assets=B03&rescale=0,4000&width=${width}&height=${height}`;
                        }
                        
                        response = await fetch(url);
                        if (!response.ok) throw new Error(`MPC Crop returned status ${response.status}`);
                    }

                    const blob = await response.blob();
                    const objectUrl = URL.createObjectURL(blob);

                    const dateText = new Date(item.properties.datetime).toLocaleDateString('en-GB', {
                        day: 'numeric', month: 'long', year: 'numeric'
                    });

                    const newOverlay = L.imageOverlay(objectUrl, bounds, {
                        pane: 'sentinelPane',
                        opacity: 0,
                        className: 'sentinel-fade-overlay'
                    }).addTo(map);

                    imageCache.set(cacheKey, { 
                        blob, 
                        objectUrl, 
                        size: blob.size, 
                        timestamp: Date.now(), 
                        bounds, 
                        dateText, 
                        itemId: item.id, 
                        overlay: newOverlay 
                    });
                    cacheOrder.push(cacheKey);
                    evictCache();
                } catch (err) {
                    console.warn(`Failed to load image ${i}:`, err);
                }

                progressBar.style.width = `${((i + 1) / items.length) * 100}%`;
                await new Promise(r => setTimeout(r, 200));
            }

            if (loadingCancelled) {
                btn.textContent = 'LOAD ALL';
                btn.disabled = false;
                progressContainer.style.display = 'none';
                return;
            }

            btn.textContent = 'READY';
            const downloadBtn = document.getElementById('download-all-btn');
            if (downloadBtn) downloadBtn.style.display = 'inline-block';
            
            setTimeout(() => {
                progressContainer.style.display = 'none';
                btn.disabled = false;
                btn.textContent = 'LOAD ALL';
            }, 2000);

            currentIndex = 0;
            document.getElementById('time-slider').value = 0;
            updateUI();
            displayImage(0);
        }

        map.on('moveend', () => {
            // Only search for new dates if the user has not preloaded/displayed images yet.
            // This prevents clearing or disrupting the loaded timeline when panning/zooming.
            const hasLoadedImages = Array.from(imageCache.values()).some(entry => entry.overlay && map.hasLayer(entry.overlay));
            if (!hasLoadedImages) {
                loadingCancelled = true;
                fetchImages();
            }
        });

        async function addDatestampToBlob(blob, dateString) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    try {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        const ctx = canvas.getContext('2d');
                        
                        // Draw original satellite image
                        ctx.drawImage(img, 0, 0);
                        
                        // Style text dynamically based on image width (e.g., 2.5% of width)
                        const fontSize = Math.max(14, Math.round(canvas.width * 0.025));
                        ctx.font = `bold ${fontSize}px sans-serif`;
                        
                        // Measure text for background box size
                        const padding = Math.max(6, Math.round(fontSize * 0.4));
                        const textWidth = ctx.measureText(dateString).width;
                        const boxWidth = textWidth + padding * 2;
                        const boxHeight = fontSize + padding * 2;
                        
                        // Position bottom-right with a small margin
                        const margin = Math.max(10, Math.round(canvas.width * 0.015));
                        const x = canvas.width - margin - boxWidth;
                        const y = canvas.height - margin - boxHeight;
                        
                        // Draw semi-transparent dark background bar
                        ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
                        ctx.fillRect(x, y, boxWidth, boxHeight);
                        
                        // Draw white text
                        ctx.fillStyle = '#FFFFFF';
                        ctx.textBaseline = 'top';
                        ctx.fillText(dateString, x + padding, y + padding);
                        
                        // Convert canvas to blob and resolve
                        canvas.toBlob((newBlob) => {
                            URL.revokeObjectURL(img.src);
                            if (newBlob) resolve(newBlob);
                            else reject(new Error("Canvas export failed"));
                        }, 'image/png');
                    } catch (err) {
                        URL.revokeObjectURL(img.src);
                        reject(err);
                    }
                };
                img.onerror = (err) => {
                    URL.revokeObjectURL(img.src);
                    reject(err);
                };
                img.src = URL.createObjectURL(blob);
            });
        }

        async function downloadAllImages() {
            if (items.length === 0) return;
            const layerType = document.getElementById('img-type').value;
            const mode = document.getElementById('workflow-mode').value;
            const btn = document.getElementById('download-all-btn');
            const originalText = btn.textContent;
            
            btn.disabled = true;
            btn.textContent = 'DOWNLOADING...';

            try {
                if (items.length === 1) {
                    // Mode 3: Latest Clean Image - direct PNG download
                    const item = items[0];
                    const key = `${item.id}_${layerType}`;
                    const entry = imageCache.get(key);
                    if (entry && entry.blob) {
                        const date = new Date(item.properties.datetime);
                        const formattedDate = date.toISOString().split('T')[0];
                        const fileName = `sentinel_latest_${formattedDate}_${layerType}.png`;

                        // Add date stamp to blob
                        const dateText = entry.dateText || formattedDate;
                        const stampedBlob = await addDatestampToBlob(entry.blob, dateText);
                        const stampedUrl = URL.createObjectURL(stampedBlob);

                        const a = document.createElement('a');
                        a.href = stampedUrl;
                        a.download = fileName;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(stampedUrl);
                    }
                } else {
                    // Mode 1 & 2: Multiple images - Bundle into a single ZIP archive
                    const zip = new JSZip();
                    let addedFilesCount = 0;

                    for (let i = 0; i < items.length; i++) {
                        const item = items[i];
                        const key = `${item.id}_${layerType}`;
                        const entry = imageCache.get(key);
                        if (entry && entry.blob) {
                            const date = new Date(item.properties.datetime);
                            const formattedDate = date.toISOString().split('T')[0];
                            const fileName = `${formattedDate}_${layerType}.png`;

                            // Add date stamp to blob
                            const dateText = entry.dateText || formattedDate;
                            const stampedBlob = await addDatestampToBlob(entry.blob, dateText);
                            zip.file(fileName, stampedBlob);
                            addedFilesCount++;
                        }
                    }

                    if (addedFilesCount > 0) {
                        // Generate descriptive ZIP filename based on active mode
                        let zipName = `sentinel_${mode}_${layerType}.zip`;
                        if (mode === 'yoy-month') {
                            const monthSelect = document.getElementById('month-filter');
                            const monthName = monthSelect.options[monthSelect.selectedIndex].text;
                            const startYear = document.getElementById('start-year').value;
                            const endYear = document.getElementById('end-year').value;
                            zipName = `sentinel_yoy_${monthName}_${startYear}-${endYear}_${layerType}.zip`;
                        } else if (mode === 'monthly-sequence') {
                            const startYear = document.getElementById('start-year').value;
                            const endYear = document.getElementById('end-year').value;
                            zipName = `sentinel_monthly_${startYear}-${endYear}_${layerType}.zip`;
                        }

                        btn.textContent = 'COMPILING ZIP...';
                        const content = await zip.generateAsync({ type: 'blob' });
                        const zipUrl = URL.createObjectURL(content);

                        const a = document.createElement('a');
                        a.href = zipUrl;
                        a.download = zipName;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(zipUrl);
                    }
                }
            } catch (err) {
                console.error("Download failed", err);
            } finally {
                btn.disabled = false;
                btn.textContent = originalText;
            }
        }

        fetchImages();
    </script>
</body>
