<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CG Mining Map</title>
    
    <!-- External CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.css" />
    <link rel="stylesheet" href="https://unpkg.com/@duccanhole/lightbox@0.0.5/style/index.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
</head>

<body>
    <div id="map"></div>

    <div id="legend-container">
        <div id="legend">
            <div id="legend-header">
                <span class="legend-title">Layers</span>
                <button id="clear-all-btn" onclick="clearAllLayers(event)">Clear All</button>
                <span class="legend-toggle">▼</span>
            </div>            <div id="legend-body"></div>    </div>
                </div>
            </div>
        </div>
    </div>

    <a href="sentinel.html" id="sentinel-fab" title="View Satellite Time Series">
        <svg viewBox="0 0 24 24" width="24" height="24">
            <path fill="currentColor" d="M21,16.5C21,16.88 20.79,17.21 20.47,17.38L12.57,21.82C12.41,21.94 12.21,22 12,22C11.79,22 11.59,21.94 11.43,21.82L3.53,17.38C3.21,17.21 3,16.88 3,16.5V7.5C3,7.12 3.21,6.79 3.53,6.62L11.43,2.18C11.59,2.06 11.79,2 12,2C12.21,2 12.41,2.06 12.57,2.18L20.47,6.62C20.79,6.79 21,7.12 21,7.5V16.5M12,4.15L5,8.09V15.91L12,19.85L19,15.91V8.09L12,4.15M12,10.5L17,7.7L18,8.26L12,11.63L6,8.26L7,7.7L12,10.5M12,15.5L17,12.7L18,13.26L12,16.63L6,13.26L7,12.7L12,15.5Z" />
        </svg>
    </a>

    <div id="zoom-controls">
        <button id="clean-view-btn" onclick="toggleCleanView(event)" title="Clean View / Screenshot Mode (Esc)">📷</button>
        <button onclick="map.zoomIn(0.5)" title="Zoom In">
            <svg viewBox="0 0 24 24" width="20" height="20">
                <path fill="currentColor" d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" />
            </svg>
        </button>
        <button onclick="map.zoomOut(0.5)" title="Zoom Out">
            <svg viewBox="0 0 24 24" width="20" height="20">
                <path fill="currentColor" d="M19,13H5V11H19V13Z" />
            </svg>
        </button>
    </div>

    <div id="coords-bar">
        <span id="coords-text">Move cursor over map</span>
    </div>

    <!-- External Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/leaflet.vectorgrid@1.3.0/dist/Leaflet.VectorGrid.bundled.js"></script>
    <script src="https://unpkg.com/@mapbox/leaflet-omnivore@0.3.4/leaflet-omnivore.min.js"></script>
    <script src="https://unpkg.com/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="https://unpkg.com/rbush@3.0.1/rbush.js"></script>

    <!-- Project Scripts -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/map-init.js"></script>
    <script src="js/layers.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/geo-images.js"></script>
    <script src="js/clan-gods.js"></script>

    <!-- Lightbox library -->
    <script type="module">
        import Lightbox from 'https://unpkg.com/@duccanhole/lightbox@0.0.5/index.js';
        window.__lb = new Lightbox();
        document.getElementById('lightbox-js').style.zIndex = '10000';

        function initGallery() {
            window.__lb.setGallery(window.PHOTO_LIST.map(img => ({
                type: 'image',
                src: img.url,
                thumbnail: img.url,
                downloadUrl: img.url,
            })));
            window.openPhotoOverlay = (id) => {
                const idx = window.PHOTO_LIST.findIndex(p => p.id === id);
                if (idx >= 0) window.__lb.openGalleryItem(idx);
            };
        }

        if (window.PHOTO_LIST && window.PHOTO_LIST.length > 0) {
            initGallery();
        } else {
            window.addEventListener('photos-loaded', initGallery);
        }
    </script>
</body>

</html>
